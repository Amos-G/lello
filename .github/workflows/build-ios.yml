name: Build iOS App

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Run Flutter analyze & tests
        working-directory: ./app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build iOS Application (unsigned)
        working-directory: ./app
        run: flutter build ios --release --no-codesign

      - name: Package Payload as IPA and ZIP
        working-directory: ./app
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Lello-unsigned.ipa Payload
          zip -r ../../../Lello-Runner.app.zip Runner.app

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lello-ios-unsigned
          path: |
            app/Lello-unsigned.ipa
            app/Lello-Runner.app.zip
          retention-days: 14
