name: partysync
description: Liste condivise in tempo reale
publish_to: none
version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_lello.png
    - assets/launcher/app_icon.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/google_fonts/Manrope-VariableFont_wght.ttf
