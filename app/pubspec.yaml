name: partysync
description: Liste condivise in tempo reale
publish_to: none
version: 1.2.1+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/launcher/app_icon.png"
  web:
    generate: true
    image_path: "assets/launcher/app_icon.png"
    background_color: "#FBF8F1"
    theme_color: "#FBF8F1"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_lello.png
    - assets/launcher/app_icon.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/google_fonts/Manrope-VariableFont_wght.ttf
